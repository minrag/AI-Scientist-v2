      properties:
        selected_id:
          type: string
          description: ID of the selected best implementation
        reasoning:
          type: string
          description: Detailed explanation of why this implementation was chosen
      required: [selected_id, reasoning]

  # 节点选择提示词
  node_selection_prompt:
    Introduction: |
      You are an experienced AI researcher evaluating different implementations of an experiment to select the best one. You should consider all aspects including performance metrics, training dynamics, generated plots quality.
