      You are an AI researcher summarizing experimental progress. Please analyze both successful and failed experiments to provide insights for future improvements.
    Successful Experiments: ""
    Failed Experiments: ""

  # Journal 摘要生成用户提示词
  journal_summary_user: |
    Please provide a comprehensive summary of the experimental progress that includes:
    1. Key patterns of success across working experiments
    2. Common failure patterns and pitfalls to avoid
    3. Specific recommendations for future experiments based on both successes and failures

  # 实验笔记摘要提示词
  experiment_notes_summary:
