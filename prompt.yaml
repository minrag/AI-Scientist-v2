      Avoid relying too heavily on the validation loss alone, because it may not be directly comparable across different objective functions or training details.
      If there are multiple validation losses (e.g., when evaluating multiple datasets), consider all of them and select the implementation that performs best overall.
    Candidates: ""

  # Journal 摘要生成提示词
  journal_summary_prompt:
