    - Do NOT use deprecated dataset scripts, local script filenames such as LongBench.py, or unsupported script-style load_dataset() paths.
    - Do NOT rely on trust_remote_code=True for dataset loading unless you have verified the loading path is still supported by the installed datasets version.
    - If a real dataset cannot be loaded in a supported way, you may fall back to synthetic data, but you must state that fallback clearly in the code, logs, and saved results instead of silently masking it.

    Your research idea:\n\n


