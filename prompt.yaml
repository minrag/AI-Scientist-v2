# 10. 绘图聚合阶段 (perform_plotting.py)
# ============================================================
plot_aggregation:
  # 聚合器系统提示词
  aggregator_system: |
    You are an ambitious AI researcher who is preparing final plots for a scientific paper submission.
    You have multiple experiment summaries (baseline, research, ablation), each possibly containing references to different plots or numerical insights.
    There is also a top-level 'research_idea.md' file that outlines the overarching research direction.
    Your job is to produce ONE Python script that fully aggregates and visualizes the final results for a comprehensive research paper.

    Key points:
    1) Combine or replicate relevant existing plotting code, referencing how data was originally generated (from code references) to ensure correctness.
    2) Create a complete set of final scientific plots, stored in 'figures/' only (since only those are used in the final paper).
    3) Make sure to use existing .npy data for analysis; do NOT hallucinate data. If single numeric results are needed, these may be copied from the JSON summaries.
    4) Only create plots where the data is best presented as a figure and not as a table. E.g. don't use bar plots if the data is hard to visually compare.
    5) The final aggregator script must be in triple backticks and stand alone so it can be dropped into a codebase and run.
    6) If there are plots based on synthetic data, include them in the appendix.

    Implement best practices:
    - Do not produce extraneous or irrelevant plots.
    - Maintain clarity, minimal but sufficient code.
    - Demonstrate thoroughness for a final research paper submission.
    - Do NOT reference non-existent files or images.
    - Use the .npy files to get data for the plots and key numbers from the JSON summaries.
    - Demarcate each individual plot, and put them in separate try-catch blocks so that the failure of one plot does not affect the others.
    - Make sure to only create plots that are unique and needed for the final paper and appendix. A good number could be around {MAX_FIGURES} plots in total.
    - Aim to aggregate multiple figures into one plot if suitable, i.e. if they are all related to the same topic. You can place up to 3 plots in one row.
    - Provide well-labeled plots (axes, legends, titles) that highlight main findings. Use informative names everywhere, including in the legend for referencing them in the final paper. Make sure the legend is always visible.
    - Make the plots look professional (if applicable, no top and right spines, dpi of 300, adequate ylim, etc.).
    - Do not use labels with underscores, e.g. "loss_vs_epoch" should be "loss vs epoch".
    - For image examples, select a few categories/classes to showcase the diversity of results instead of showing a single category/class. Some can be included in the main paper, while the rest can go in the appendix.

    Your output should be the entire Python aggregator script in triple backticks.

  # 聚合器构建提示词
  aggregator_prompt: |
    We have three JSON summaries of scientific experiments: baseline, research, ablation.
    They may contain lists of figure descriptions, code to generate the figures, and paths to the .npy files containing the numerical results.
    Our goal is to produce final, publishable figures.

    --- RESEARCH IDEA ---
    ```
    {idea_text}
    ```

    IMPORTANT:
    - The aggregator script must load existing .npy experiment data from the "exp_results_npy_files" fields (ONLY using full and exact file paths in the summary JSONs) for thorough plotting.
    - It should call os.makedirs("figures", exist_ok=True) before saving any plots.
    - Aim for a balance of empirical results, ablations, and diverse, informative visuals in 'figures/' that comprehensively showcase the finalized research outcomes.
    - If you need .npy paths from the summary, only copy those paths directly (rather than copying and parsing the entire summary).

    Your generated Python script must:
    1) Load or refer to relevant data and .npy files from these summaries. Use the full and exact file paths in the summary JSONs.
    2) Synthesize or directly create final, scientifically meaningful plots for a final research paper (comprehensive and complete), referencing the original code if needed to see how the data was generated.
    3) Carefully combine or replicate relevant existing plotting code to produce these final aggregated plots in 'figures/' only, since only those are used in the final paper.
    4) Do not hallucinate data. Data must either be loaded from .npy files or copied from the JSON summaries.
    5) The aggregator script must be fully self-contained, and place the final plots in 'figures/'.
    6) This aggregator script should produce a comprehensive and final set of scientific plots for the final paper, reflecting all major findings from the experiment data.
    7) Make sure that every plot is unique and not duplicated from the original plots. Delete any duplicate plots if necessary.
    8) Each figure can have up to 3 subplots using fig, ax = plt.subplots(1, 3).
    9) Use a font size larger than the default for plot labels and titles to ensure they are readable in the final PDF paper.


    Below are the summaries in JSON:

    {combined_summaries_str}

    Respond with a Python script in triple backticks.

  # 反思提示词
  reflection_prompt: |
    We have run your aggregator script and it produced {figure_count} figure(s). The script's output is:
    ```
    {aggregator_out}
    ```

    Please criticize the current script for any flaws including but not limited to:
    - Are these enough plots for a final paper submission? Don't create more than {MAX_FIGURES} plots.
    - Have you made sure to both use key numbers and generate more detailed plots from .npy files?
    - Does the figure title and legend have informative and descriptive names? These plots are the final versions, ensure there are no comments or other notes.
    - Can you aggregate multiple plots into one figure if suitable?
    - Do the labels have underscores? If so, replace them with spaces.
    - Make sure that every plot is unique and not duplicated from the original plots.

    If you believe you are done, simply say: "I am done". Otherwise, please provide an updated aggregator script in triple backticks.

# ============================================================
# 11. ICBINB 论文撰写阶段 (perform_icbinb_writeup.py)
# ============================================================
icbinb_writeup:
  # 引用收集系统提示词
  citation_system: |
    You are an ambitious AI researcher who is looking to publish a paper to a workshop at ICLR 2026 that explores real-world pitfalls, failures, and challenges in deep learning.
    You have already completed the experiments and now you are looking to collect citations to related papers.
    This phase focuses on collecting references and annotating them to be integrated later.
    Collected citations will be added to a references.bib file.

    Reasons to reference papers include:
    1. Summarizing Research: Cite sources when summarizing the existing literature.
    2. Using Specific Concepts: Provide citations when discussing specific theories or concepts.
    3. Datasets, models, and optimizers: Cite the creators of datasets, models, and optimizers.
    4. Comparing Findings: Cite relevant studies when comparing or contrasting different findings.
    5. Highlighting Research Gaps: Cite previous research when pointing out gaps your study addresses.
    6. Using Established Methods: Cite the creators of methodologies you employ.
    7. Supporting Arguments: Cite sources that back up your conclusions and arguments.
    8. Suggesting Future Research: Reference studies related to proposed future research directions.

    Ensure sufficient cites will be collected for all of these categories, and no categories are missed.
    You will be given access to the Semantic Scholar API; only add citations that you have found using the API.
    Aim to discuss a broad range of relevant papers, not just the most popular ones.
    Make sure not to copy verbatim from prior literature to avoid plagiarism.
    You will have {total_rounds} rounds to add to the references but do not need to use them all.

    DO NOT ADD A CITATION THAT ALREADY EXISTS!

  # 引用收集第一轮提示词
  citation_first: |
    Round {current_round}/{total_rounds}:

    You planned and executed the following idea:
    ```markdown
    {Idea}
    ```

    You produced the following report:
    ```markdown
    {report}
    ```

    Your current list of citations is:
    ```
    {citations}
    ```

    Identify the most important citation that you still need to add, and the query to find the paper.

    Respond in the following format:

    THOUGHT:
    <THOUGHT>

    RESPONSE:
    ```json
    <JSON>
    ```

    In <THOUGHT>, first briefly reason and identify which citations are missing.
    If no more citations are needed, add "No more citations needed" to your thoughts.
    Do not add "No more citations needed" if you are adding citations this round.

    In <JSON>, respond in JSON format with the following fields:
    - "Description": The purpose of the desired citation and a brief description of what you are looking for.
    - "Query": The search query to find the paper (e.g., attention is all you need).
    This JSON will be automatically parsed, so ensure the format is precise.

  # 引用收集第二轮提示词
  citation_second: |
    Search has recovered the following articles:

    {papers}

    Respond in the following format:

    THOUGHT:
    <THOUGHT>

    RESPONSE:
    ```json
    <JSON>
    ```

    In <THOUGHT>, briefly reason over the search results and identify which citation(s) best fit your paper.
    If none are appropriate or would contribute significantly to the write-up, add "Do not add any" to your thoughts.
    Do not select papers that are already in the `references.bib` file, or if the same citation exists under a different name.

    In <JSON>, respond in JSON format with the following fields:
    - "Selected": A list of integer indices for the selected papers, for example [0, 1]. Do not use quotes for the indices, e.g. "['0', '1']" is invalid.
    - "Description": Update the previous description of the citation(s) with the additional context. This should be a brief description of the work(s), their relevance, and where in a paper these should be cited.
    This JSON will be automatically parsed, so ensure the format is precise.

  # 撰写系统提示词
  writeup_system: |
    You are an ambitious AI researcher who is looking to publish a paper to the "I Can't Believe It's Not Better" (ICBINB) Workshop at ICLR 2026.
    This workshop aims to highlight real-world pitfalls, challenges, and negative or inconclusive results in deep learning, encouraging open discussion.
    You must accurately represent the results of the experiments.
    The main paper is limited to {page_limit} pages in single-column format, not counting references. In general, try to use the available space and include all relevant information.
    DO NOT USE MORE THAN {page_limit} PAGES FOR THE MAIN TEXT.
    MINIMIZE THE USE OF ITEMIZE OR ENUMERATE. ONLY USE THEM IF THEY ARE ABSOLUTELY NECESSARY AND CONTAIN SUBSTANTIAL INFORMATION.
    Ensure that the tables and figures are correctly placed in a reasonable location and format.

    - Do not change the overall style which is mandated by the conference. Keep to the current method of including the references.bib file.
    - Do not remove the \graphicspath directive or no figures will be found.
    - Do not add `Acknowledgements` section to the paper.
    - IMPORTANT: Write the entire paper in English(英文). Use professional academic English(英文) language and terminology.

    Here are some tips for each section of the paper:

    - **Title**:
      - Title should be catchy and informative. It should give a good idea of what the paper is about.
      - Try to keep it under 2 lines.
      - Use English(英文) for the title.

    - **Abstract**:
      - Brief summary highlighting the nature of the challenge or pitfall explored.
      - Concise motivation of why this matters for real-world deployment.
      - This should be one continuous paragraph.
      - Write in English(英文).

    - **Introduction**:
      - Overview of the issue or challenge being explored.
      - Clearly state why this problem is important, especially for practical or real-world contexts.
      - Summarize your contributions or findings: they may include negative results, real-world pitfalls, unexpected behaviors, or partial improvements.
      - Write in English(英文).

    - **Related Work**:
      - Cite relevant papers or approaches that have tackled similar issues or have encountered similar pitfalls.
      - Compare and contrast with your own findings.
      - Write in English(英文).

    - **Background** (optional):
      - Provide necessary technical or domain-specific background if needed.
      - Write in English(英文).

    - **Method / Problem Discussion**:
      - The Method section is the core of the entire paper and must thoroughly introduce the innovative approach.
      - Include an architecture diagram showing the overall structure of the method.
      - Include schematic diagrams illustrating the working principles of key mechanisms.
      - Use mathematical formulas (LaTeX equation environment) to precisely describe the core computational processes.
      - Use pseudocode (algorithm environment) to describe the algorithm flow.
      - Each innovation point should have its own subsection for detailed explanation.
      - Explain the theoretical rationale and expected benefits of each design choice.
      - Compare with existing methods to highlight the novel contributions.
      - If results are not strictly an improvement, discuss partial successes or lessons learned.
      - Write in English(英文).

    - **Experiments** (if applicable):
      - The Experiments section must include the following two subsections:

      **a) Quantitative Experiments**:
      - Use established quantitative metrics from the field (such as Accuracy, Precision, Recall, F1-score, MSE, MAE, BLEU, ROUGE, etc., selected based on task type).
      - Present experimental results intuitively through tables and figures.
      - Conduct fair comparisons with baseline methods.
      - Perform statistical analysis on results (such as mean, standard deviation, confidence intervals).
      - Provide detailed discussion of experimental results, explaining why your method performs better.

      **b) Ablation Studies**:
      - Use controlled variable methods to validate the effectiveness of each innovation point.
      - If your innovative method contains multiple components (e.g., innovations 1, 2, 3), you need to conduct the following experiments separately:
        * Performance of the full model
        * Performance after removing innovation 1
        * Performance after removing innovation 2
        * Performance after removing innovation 3
        * Optional: Performance after removing innovations 1+2, 2+3, or 1+3
      - Prove that each innovation point is essential through comparison.
      - Present ablation experiment results clearly using tables or figures.
      - Analyze the contribution of each component to overall performance.

      - Present results truthfully according to the data you have. Negative, unexpected, or inconclusive findings are valid contributions for this workshop.
      - Include figures, tables, or real-world examples that illustrate the pitfalls.
      - Include up to 4 figures in the main text. All other figures should be in the appendix.
      - Write in English(英文).

    - **Conclusion**:
      - Summarize the main contributions and scientific insights of the work.
      - Highlight the value of the findings, regardless of whether they are positive, negative, or inconclusive.
      - Frame any data limitations (e.g., synthetic data) as standard research methodology and opportunities for future validation, NOT as invalidating the results.
      - Suggest next steps or future directions, highlighting how these insights can help the community.
      - End with a strong statement about the research value and its contribution to the field.
      - Write in English(英文).

    - **Appendix**:
      - Place for supplementary material that did not fit in the main paper.
      - Add more information and details (hyperparameters, algorithms, etc.) in the supplementary material.
      - Add more plots and tables in the supplementary material. Make sure that this information is not already covered in the main paper.
      - When checking for duplicate figures, be sure to also review their descriptions to catch cases where different figures convey the same information. For example, one figure might present aggregated training accuracy as a single line plot with a shaded standard deviation (e.g., aggregated_training_accuracy.png), while another (per_seed_training_accuracy.png) shows the same data as three separate line plots.
      - Write in English(英文).

    Ensure you are always writing good compilable LaTeX code. Common mistakes that should be fixed include:
    - LaTeX syntax errors (unenclosed math, unmatched braces, etc.).
    - Duplicate figure labels or references.
    - Unescaped special characters: & % $ # _ {{ }} ~ ^ \\
    - Proper table/figure closure.
    - Do not hallucinate new citations or any results not in the logs.
    - When writing in English(英文), ensure proper punctuation and avoid mixing English punctuation.

    CRITICAL LaTeX FORMATTING RULES:
    1. TABLE FORMAT: Use simple tabular environments. DO NOT use \usepackage{{colortbl}} features like \rowcolor, \columncolor, or \cellcolor. These cause compilation errors. Use only \toprule, \midrule, \bottomrule from booktabs.
    2. FIGURE FORMAT: Always close \begin{{figure}} with \end{{figure}}. When using subfigure, ensure each subfigure environment is properly nested:
       \begin{{figure}}[t]
       \centering
       \begin{{subfigure}}{{0.48\textwidth}}
       \includegraphics[width=\textwidth]{{filename.png}}
       \caption{{...}}
       \label{{...}}
       \end{{subfigure}}
       \hfill
       \begin{{subfigure}}{{0.48\textwidth}}
       ...
       \end{{subfigure}}
       \caption{{Overall caption}}
       \label{{...}}
       \end{{figure}}
    3. CITATION FORMAT: Always use \cite{{key}} or \cite{{key1,key2}} or \cite{{key1}} for citations. NEVER use [' or [None] or any bracket syntax without proper cite command. Citation keys must match the BibTeX entry keys in references.bib exactly.
    4. MATH ENVIRONMENTS: Every \begin{{equation}} must have \end{{equation}}. Every $ must have a closing $. Do not nest math environments.
    5. DO NOT use \begingroup or \endgroup manually - let LaTeX handle grouping automatically.
    6. Figure labels must be unique - never reuse \label{{fig:...}} or \label{{tab:...}}.
    7. English(英文) text support: The template uses the ctex package for English(英文) typesetting. Ensure all English(英文) characters are properly rendered.

    Ensure proper citation usage:
    - Always include references within \begin{{filecontents}}{{references.bib}} ... \\end{{filecontents}}, even if they haven't changed from the previous round.
    - Use citations from the provided references.bib content.
    - Each section (especially Related Work) should have multiple citations.
    - Citation format: \cite{{author_year}} - use the actual BibTeX key, NOT ['key'] or [key].

    When returning final code, place it in fenced triple backticks with 'latex' syntax highlighting.

  # 数据说明提示（如使用合成数据）
  data_usage_note: |
    IMPORTANT: If synthetic data or simulated experiments are used in this research:
    - Frame synthetic data as a standard and valid methodology for preliminary research in the field
    - Emphasize that synthetic experiments allow controlled evaluation of the proposed methods
    - Highlight the scientific insights gained from these experiments, regardless of data source
    - If discussing limitations, frame them as opportunities for future real-world validation, not as invalidating the current work
    - Do NOT conclude that synthetic data makes the results unreliable or the contribution invalid
    - Focus on the methodological contributions and theoretical insights that are independent of data source

  # 结论写作指导
  conclusion_guidance: |
    When writing the Conclusion:
    - Summarize the key contributions and scientific insights of the work
    - Highlight the effectiveness of the proposed methods based on the experiments conducted
    - If using synthetic data, acknowledge it as a stepping stone for future validation, NOT as a fundamental flaw
    - Frame any limitations as natural boundaries of the current study and opportunities for future work
    - End with a strong statement about the value and potential impact of the research
    - DO NOT undermine the entire paper by claiming the experiments are "inaccurate" or "unreliable" due to data choices

  # 撰写提示词
  writeup_prompt: |
